      position: sticky;

      margin: 0;

    }

    .hero {
      min-height: 600px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;

      background:

        url("https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=80");

      background-size: cover;
      background-position: center;
      color: white;
    }

    .hero h2 {
      font-size: 50px;
      line-height: 1.3;
      margin: 0 0 20px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 35px;
    }

    .button {
      display: inline-block;
      padding: 15px 40px;
      background: white;
      color: #333;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
    }

    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      font-size: 32px;
      margin-bottom: 50px;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .menu-item {
      background: white;
      padding: 30px;
      text-align: center;
      border-radius: 15px;
    }

    .menu-item h3 {
      margin-top: 0;

    .price {
      font-size: 24px;

    }

    .info {
      background: white;
      max-width: none;
    }

    .info-inner {
      max-width: 700px;
      margin: auto;
    }

    footer {
      padding: 30px;
      text-align: center;
      background: #333;
      color: white;
    }

    @media (max-width: 700px) {
      .hero h2 {
        font-size: 36px;
      }

      .menu {
        grid-template-columns: 1fr;
      }
    }
